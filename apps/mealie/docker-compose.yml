services:
  mealie:
    container_name: 'mealie'
    image: 'ghcr.io/mealie-recipes/mealie:v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69'
    restart: 'unless-stopped'
    user: '65020:65020'
    read_only: true
    mem_limit: 1G
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    networks:
      - 'default-frontend'
    tmpfs:
      - '/tmp'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - 'mealie-data:/app/data'
    environment:
      PUID: '65020'
      PGID: '65020'
      HOME: '/tmp'
      DB_ENGINE: 'postgres'
      # the discrete POSTGRES_* variables cannot express sslmode
      POSTGRES_URL_OVERRIDE: 'postgresql://${MEALIE_POSTGRES_USER}:${MEALIE_POSTGRES_PASSWORD}@${MEALIE_POSTGRES_SERVER}:${MEALIE_POSTGRES_PORT:-5432}/${MEALIE_POSTGRES_DATABASE}?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt'
      BASE_URL: 'https://${MEALIE_DOMAIN}'
      ALLOW_SIGNUP: 'false'
      LOG_LEVEL: 'warning'
      TZ: 'Europe/Zurich'
      SMTP_HOST: '${MEALIE_SMTP_HOST}'
      SMTP_PORT: '${MEALIE_SMTP_PORT:-587}'
      SMTP_USER: '${MEALIE_SMTP_USER}'
      SMTP_PASSWORD: '${MEALIE_SMTP_PASSWORD}'
      SMTP_FROM_EMAIL: '${MEALIE_SMTP_FROM_ADDRESS}'
    healthcheck:
      test: 'curl -f http://localhost:9000/api/app/about'
      start_period: '30s'
      interval: '10s'
      timeout: '5s'
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mealie.rule=Host(`${MEALIE_DOMAIN}`)'
      - 'traefik.http.routers.mealie.middlewares=default@file'
      - 'traefik.http.services.mealie.loadbalancer.server.port=9000'

volumes:
  mealie-data:
    external: true

networks:
  default-frontend:
    external: true
