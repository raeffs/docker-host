log:
  level: info
  job_level: info

runner:
  file: .runner
  capacity: 4
  envs:
    TZ: 'Europe/Zurich'
  timeout: 1h
  shutdown_timeout: 10s
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  report_interval: 1s
  labels: ['docker']

cache:
  enabled: true
  port: 0
  dir: ''
  external_server: ''
  secret: ''
  host: ''
  proxy_port: 0
  actions_cache_url_override: ''

container:
  network: ''
  enable_ipv6: false
  privileged: false
  options: '--cpus 2 --memory 900m --memory-swap 900m'
  workdir_parent:
  valid_volumes: []
  docker_host: '-'
  force_pull: false
  force_rebuild: false

host:
  workdir_parent:
