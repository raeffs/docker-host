services:
  forgejo-runner-dind:
    container_name: 'forgejo-runner-dind'
    image: 'docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121'
    restart: 'unless-stopped'
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    # Required for docker-in-docker; the plaintext TCP socket is confined to
    # the forgejo-runner-backend network below.
    privileged: true
    mem_limit: 4G
    networks:
      - 'forgejo-runner-backend'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - '/etc/timezone:/etc/timezone:ro'
      - 'forgejo-runner-dind-data:/var/lib/docker'
    environment:
      DOCKER_HOST: 'tcp://localhost:2375'
    labels:
      ofelia.enabled: 'true'
      ofelia.job-exec.prune-dind.schedule: '@daily'
      ofelia.job-exec.prune-dind.command: 'sh -c "docker system prune -af --filter until=168h && docker volume prune -af"'
    healthcheck:
      test: ['CMD', 'docker', 'info']
      start_period: '30s'
      interval: '30s'
      timeout: '5s'
      retries: 3

  forgejo-runner:
    container_name: 'forgejo-runner'
    image: 'data.forgejo.org/forgejo/runner:13@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d'
    restart: 'unless-stopped'
    stop_signal: 'SIGTERM'
    stop_grace_period: '15s'
    # The daemon runs in the background so the trap can forward SIGTERM to it
    # and end the retry loop instead of restarting it.
    command: >-
      bash -c '
      umask 077 ;
      secret="${FORGEJO_RUNNER_SHARED_SECRET}" ;
      printf %s "$$secret" > /tmp/runner-token ;
      hex=$$(printf %s "$${secret:0:16}" | od -A n -t x1 | tr -d " \n") ;
      uuid="$${hex:0:8}-$${hex:8:4}-$${hex:12:4}-$${hex:16:4}-$${hex:20:12}" ;
      stop=0 ;
      stop_daemon() { stop=1 ; kill -TERM "$$pid" 2>/dev/null ; } ;
      trap stop_daemon TERM INT ;
      while [ "$$stop" = 0 ] ; do forgejo-runner daemon --config config.yml --url "https://${FORGEJO_DOMAIN}" --uuid "$$uuid" --token-url file:/tmp/runner-token & pid=$$! ; wait $$pid ; [ "$$stop" = 0 ] && sleep 5 ; done ; exit 0
      '
    mem_limit: 256M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    networks:
      - 'forgejo-runner-backend'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - '/etc/timezone:/etc/timezone:ro'
      - 'forgejo-runner-data:/data'
      - './config/config.yml:/data/config.yml:ro'
    environment:
      DOCKER_HOST: 'tcp://forgejo-runner-dind:2375'
    healthcheck:
      test: ['CMD', 'pgrep', '-x', 'forgejo-runner']
      start_period: '30s'
      interval: '30s'
      timeout: '5s'
      retries: 3
    depends_on:
      forgejo-runner-dind:
        condition: 'service_healthy'

volumes:
  forgejo-runner-dind-data:
    name: 'forgejo-runner-dind-data'
  forgejo-runner-data:
    name: 'forgejo-runner-data'

networks:
  forgejo-runner-backend:
