services:
  cloudflared:
    container_name: 'cloudflared'
    image: 'cloudflare/cloudflared:2026.9.0@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9'
    command: 'tunnel --no-autoupdate run'
    restart: 'unless-stopped'
    user: '65015:65015'
    read_only: true
    mem_limit: 64M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      TUNNEL_TOKEN: '${CLOUDFLARED_TOKEN}'
      TUNNEL_METRICS: '127.0.0.1:20241'
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', 'ready']
      start_period: '20s'
      interval: '30s'
      timeout: '5s'
      retries: 3
