services:
  cloudflared:
    container_name: 'cloudflared'
    image: 'cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2'
    command: 'tunnel --no-autoupdate run'
    restart: 'unless-stopped'
    user: '65015:65015'
    read_only: true
    mem_limit: 64M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      TUNNEL_TOKEN: '${CLOUDFLARED_TOKEN}'
      TUNNEL_METRICS: '127.0.0.1:20241'
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', 'ready']
      start_period: '20s'
      interval: '30s'
      timeout: '5s'
      retries: 3
