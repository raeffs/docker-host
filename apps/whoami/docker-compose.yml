services:
  whoami:
    image: 'ghcr.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44'
    container_name: 'whoami'
    restart: 'unless-stopped'
    user: '65010:65010'
    read_only: true
    mem_limit: 8M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    networks:
      - 'default-frontend'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami.rule=Host(`whoami.${DEFAULT_DOMAIN_SUFFIX}`)'
      - 'traefik.http.routers.whoami.middlewares=default@file'
      - 'traefik.http.services.whoami.loadbalancer.server.port=80'

networks:
  default-frontend:
    external: true
