services:
  wishlist:
    container_name: 'wishlist'
    image: 'ghcr.io/cmintey/wishlist:v0.66.0'
    restart: 'unless-stopped'
    user: '65007:65007'
    mem_limit: 256M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    networks:
      - 'default-frontend'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - 'wishlist-uploads:/usr/src/app/uploads'
      - 'wishlist-data:/usr/src/app/data'
    environment:
      ORIGIN: 'https://${WISHLIST_DOMAIN}'
      TOKEN_TIME: '${WISHLIST_TOKEN_TIME}'
      DEFAULT_CURRENCY: '${WISHLIST_DEFAULT_CURRENCY}'
    healthcheck:
      # the image ships neither curl nor wget, so the bundled node is used as the http client
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - 'fetch("http://localhost:3280/").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      start_period: '30s'
      interval: '10s'
      timeout: '5s'
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wishlist.rule=Host(`${WISHLIST_DOMAIN}`)'
      - 'traefik.http.routers.wishlist.middlewares=default@file'
      - 'traefik.http.services.wishlist.loadbalancer.server.port=3280'

volumes:
  wishlist-data:
    external: true
  wishlist-uploads:
    external: true

networks:
  default-frontend:
    external: true
