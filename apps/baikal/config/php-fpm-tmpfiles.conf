# Replaces the php8.1-fpm tmpfiles config shipped by Debian, which is
#
#   d /run/php 0755 www-data www-data -
#
# /etc/init.d/php8.1-fpm runs `systemd-tmpfiles --remove --create` on it and only
# starts the daemon when that exits 0. Chowning to www-data fails as a non-root
# user, so php-fpm would never start. Dropping the owner columns leaves the
# directory's ownership alone and the command succeeds.

d /run/php 0755 - - -
