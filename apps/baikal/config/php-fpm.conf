; Replaces the image's php-fpm config. Three changes are needed to run as a
; non-root user on a read-only root filesystem:
;
;   - the packaged error_log is /var/log/php8.1-fpm.log, which is unwritable, so
;     php-fpm would refuse to start. Logging to stderr also puts PHP errors in
;     `docker logs` next to nginx's, which is where the rest of the estate logs.
;   - the packaged pid is /run/php/php8.1-fpm.pid; /run is a tmpfs here and the
;     pool socket already lives at its root, so keep the pid next to it.
;   - the packaged pool sets listen.owner/listen.group to the image's `nginx`
;     user (101). Chowning the socket away from our own uid is not permitted and
;     is fatal ("FPM initialization failed"), so the pool is inlined here without
;     it. nginx runs as the same uid as php-fpm, so the default socket ownership
;     is already correct. user/group are dropped for the same reason — php-fpm
;     ignores them when it is not root.
;
; Inlining the pool means /etc/php/8.1/fpm/pool.d/www.conf is no longer read. The
; pm.* values below are the packaged ones; re-check them on image bumps.
;
; The 8.1 in the mount target tracks the PHP version in the image. If a bump
; moves it, this file stops being read, php-fpm falls back to its packaged config
; and fails to start — the healthcheck catches that.

[global]
pid = /run/php-fpm.pid
error_log = /dev/stderr

[www]
listen = /var/run/php-fpm.sock
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
