# A copy of the image's /etc/nginx/conf.d/default.conf, changed only to listen on
# an unprivileged port. The container runs as a non-root user, which cannot bind
# :80 — Docker grants no ambient capabilities to a non-root user, so
# `cap_add: NET_BIND_SERVICE` would not help either.
#
# The IPv6 listener is dropped: the frontend bridge is IPv4-only, and leaving it
# in would make the image's 40-disable-nginx-ipv6-if-unsupported.sh try to `sed -i`
# this read-only file.
#
# Keep in sync with upstream on image bumps:
# https://github.com/ckulka/baikal-docker/blob/master/nginx/default.conf

server {
  listen 8080;
  server_name _;

  root   /var/www/baikal/html;
  index index.php;

  rewrite ^/.well-known/caldav /dav.php redirect;
  rewrite ^/.well-known/carddav /dav.php redirect;

  charset utf-8;

  location ~ /(\.ht|Core|Specific) {
    deny all;
    return 404;
  }

  # Pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
  location ~ ^(.+\.php)(.*)$ {
    try_files $fastcgi_script_name =404;
    include        /etc/nginx/fastcgi_params;
    fastcgi_split_path_info  ^(.+\.php)(.*)$;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    fastcgi_param  PATH_INFO        $fastcgi_path_info;
  }

  # Deny access to Apache httpd .htaccess files, see https://github.com/JsBergbau/BaikalAnleitung#webserver-konfiguration
  location ~ /.ht {
    deny all;
  }
}
