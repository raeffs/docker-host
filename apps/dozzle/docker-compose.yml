services:
  dozzle:
    container_name: 'dozzle'
    image: 'amir20/dozzle:v10.6.15@sha256:5bb13e26b62f9bc4bd390e3e0c9423263b7df86e3a4167b718cc6e352f96b54f'
    restart: 'unless-stopped'
    user: '65003:65003'
    read_only: true
    mem_limit: 64M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    networks:
      - 'default-frontend'
      - 'dozzle-dockerproxynet'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
      DOZZLE_REMOTE_HOST: 'tcp://dozzle-dockerproxy:2375|${DOZZLE_HOSTNAME}'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.dozzle.rule=Host(`${DOZZLE_DOMAIN}`)'
      - 'traefik.http.routers.dozzle.middlewares=default@file'
      - 'traefik.http.services.dozzle.loadbalancer.server.port=8080'
    healthcheck:
      test: ['CMD', '/dozzle', 'healthcheck']
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - 'dozzle-dockerproxy'

  dozzle-dockerproxy:
    extends:
      file: '../../libs/docker-socket-proxy/docker-compose.yml'
      service: 'docker-socket-proxy'
    container_name: 'dozzle-dockerproxy'
    command:
      - '-allowfrom=dozzle'
      - '-allowGET=/v1\..{2}/(containers/.*|events|info)|/_ping'
      - '-allowHEAD=/_ping'
    user: '65004:${DOZZLE_DOCKER_GID}'
    networks:
      - 'dozzle-dockerproxynet'

networks:
  default-frontend:
    external: true
  dozzle-dockerproxynet:
    name: 'dozzle-dockerproxynet'
    internal: true
    attachable: false
