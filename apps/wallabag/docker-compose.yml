services:
  wallabag:
    container_name: 'wallabag'
    image: 'wallabag/wallabag:2.6.14'
    restart: 'unless-stopped'
    mem_limit: 256M
    cap_drop:
      - 'ALL'
    cap_add:
      - 'CAP_DAC_OVERRIDE'
      - 'CAP_SETGID'
      - 'CAP_SETUID'
      - 'CHOWN'
    security_opt:
      - 'no-new-privileges'
    command: 'sh -c "/entrypoint.sh migrate && /provision.sh && /entrypoint.sh wallabag"'
    networks:
      - 'default-frontend'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - './provision.sh:/provision.sh:ro'
      - 'wallabag-data:/var/www/wallabag/data'
      - 'wallabag-images:/var/www/wallabag/web/assets/images'
    environment:
      WALLABAG_INITIAL_USER: '${WALLABAG_INITIAL_USER}'
      WALLABAG_INITIAL_PASSWORD: '${WALLABAG_INITIAL_PASSWORD}'
      SYMFONY__ENV__DATABASE_DRIVER: 'pdo_pgsql'
      SYMFONY__ENV__DATABASE_HOST: '${WALLABAG_POSTGRES_SERVER}'
      SYMFONY__ENV__DATABASE_PORT: '${WALLABAG_POSTGRES_PORT:-5432}'
      SYMFONY__ENV__DATABASE_USER: '${WALLABAG_POSTGRES_USER}'
      SYMFONY__ENV__DATABASE_PASSWORD: '${WALLABAG_POSTGRES_PASSWORD}'
      SYMFONY__ENV__DATABASE_NAME: '${WALLABAG_POSTGRES_DATABASE}'
      PGSSLMODE: 'verify-full'
      PGSSLROOTCERT: '/etc/ssl/certs/ca-certificates.crt'
      SYMFONY__ENV__DOMAIN_NAME: 'https://${WALLABAG_DOMAIN}'
      SYMFONY__ENV__FOSUSER_REGISTRATION: 'false'
      SYMFONY__ENV__SECRET: '${WALLABAG_SECRET}'
    healthcheck:
      # the built-in healthcheck has no start period, so the migrations on boot mark the container unhealthy
      test: 'curl -f --user-agent healthcheck http://localhost/api/info'
      start_period: '60s'
      interval: '10s'
      timeout: '5s'
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wallabag.rule=Host(`${WALLABAG_DOMAIN}`)'
      - 'traefik.http.routers.wallabag.middlewares=default@file'
      - 'traefik.http.services.wallabag.loadbalancer.server.port=80'

volumes:
  wallabag-data:
    external: true
  wallabag-images:
    external: true

networks:
  default-frontend:
    external: true
