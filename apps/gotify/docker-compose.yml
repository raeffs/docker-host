services:
  gotify:
    container_name: 'gotify'
    image: 'ghcr.io/gotify/server:3.0.0@sha256:d75e89e0e28389c00c2556afe01282a37ee9756b0285799aa25214243aebd5e5'
    restart: 'unless-stopped'
    mem_limit: 128M
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges'
    networks:
      - 'default-frontend'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - 'gotify-data:/app/data'
    environment:
      GOTIFY_DATABASE_DIALECT: 'postgres'
      GOTIFY_DATABASE_CONNECTION: 'host=${GOTIFY_POSTGRES_SERVER} port=${GOTIFY_POSTGRES_PORT:-5432} user=${GOTIFY_POSTGRES_USER} dbname=${GOTIFY_POSTGRES_DATABASE} password=${GOTIFY_POSTGRES_PASSWORD} sslmode=verify-full'
    # healthcheck is built into the image
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.gotify.rule=Host(`${GOTIFY_DOMAIN}`)'
      - 'traefik.http.routers.gotify.middlewares=default@file'
      - 'traefik.http.services.gotify.loadbalancer.server.port=80'

volumes:
  gotify-data:
    external: true

networks:
  default-frontend:
    external: true
