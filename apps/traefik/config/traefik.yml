global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  # DEBUG, INFO, WARN, ERROR, FATAL, PANIC
  level: 'INFO'

providers:
  docker:
    exposedByDefault: false
    watch: true
    network: 'default-frontend'
    endpoint: 'tcp://traefik-dockerproxy:2375'
  file:
    directory: '/etc/traefik/dynamic'
    watch: true

api: {}

ping: {}

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: 'websecure'
          scheme: 'https'
          permanent: true
  websecure:
    address: :443
    http3: {}
    # routers without an explicit entrypoint bind here only, never to ssh-forgejo
    asDefault: true
    http:
      tls:
        certResolver: 'letsencrypt'
  ssh-forgejo:
    address: :2222

certificatesResolvers:
  letsencrypt:
    acme:
      storage: '/certificates/acme.json'
      # use the staging server to test acme settings
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 10s
          disableChecks: true
        resolvers:
          - '1.1.1.1:53'
          - '8.8.8.8:53'
