services:
  postgres:
    image: 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188'
    restart: 'no'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null'
      start_period: '30s'
      interval: '5s'
      timeout: '5s'
      retries: 3
