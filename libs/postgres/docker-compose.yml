services:
  postgres:
    image: 'postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15'
    restart: 'no'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null'
      start_period: '30s'
      interval: '5s'
      timeout: '5s'
      retries: 3
