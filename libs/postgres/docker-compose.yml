services:
  postgres:
    image: 'postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2'
    restart: 'no'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null'
      start_period: '30s'
      interval: '5s'
      timeout: '5s'
      retries: 3
