services:
  postgres:
    image: 'postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792'
    restart: 'no'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null'
      start_period: '30s'
      interval: '5s'
      timeout: '5s'
      retries: 3
