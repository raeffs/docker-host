services:
  postgres:
    image: 'postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f'
    restart: 'no'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null'
      start_period: '30s'
      interval: '5s'
      timeout: '5s'
      retries: 3
