name: App Checks

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    name: Affected Apps
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      apps: ${{ steps.affected.outputs.apps }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine affected apps
        id: affected
        run: .github/scripts/affected-apps.sh

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate compose files
        run: .github/scripts/validate-compose.sh

  healthcheck:
    name: ${{ matrix.app }}
    needs: affected
    if: needs.affected.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.affected.outputs.apps) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Healthcheck
        uses: ./.github/actions/healthcheck
        with:
          app-name: ${{ matrix.app }}

  all-checks:
    name: All Checks
    if: always()
    needs:
      - affected
      - compose-config
      - healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify affected result
        if: needs.affected.result != 'success'
        run: exit 1

      - name: Verify compose-config result
        if: needs.compose-config.result != 'success'
        run: exit 1

      - name: Verify healthcheck result
        if: needs.healthcheck.result != 'success' && needs.healthcheck.result != 'skipped'
        run: exit 1
