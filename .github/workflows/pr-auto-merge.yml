name: PR Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.login == 'raeffs'
      || github.event.pull_request.user.login == 'renovate[bot]')

    steps:
      - name: Enable Auto-Merge for trusted Authors
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --rebase --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.PAT }}
